<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RS512 JWT CSV Tool</title>
<style>
:root{color-scheme:dark;--bg:#0b0f14;--panel:#121820;--field:#0d131a;--border:#293442;--text:#edf2f7;--muted:#9aa8b7;--accent:#58a6ff;--ok:#4ad295;--err:#ff8d8d;--warn:#f5c451}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif;line-height:1.5}.wrap{width:min(1050px,calc(100% - 32px));margin:30px auto}h1{margin:0 0 6px}h2{margin:0 0 14px;font-size:1.2rem}.sub,.hint{color:var(--muted)}.sub{margin:0 0 22px}.hint{font-size:.84rem;margin:7px 0 0}.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:21px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.full{grid-column:1/-1}.buttons{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button{border:1px solid var(--border);border-radius:7px;padding:11px 14px;background:#1b2430;color:var(--text);font-weight:700;cursor:pointer}button:hover{background:#243142}.primary{background:var(--accent);border-color:var(--accent);color:#06111d}.danger{color:#ffd2d2;border-color:#633b3b}label{display:block;font-weight:700;font-size:.92rem;margin:0 0 6px}textarea{width:100%;min-height:140px;resize:vertical;background:var(--field);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:10px;font-family:Consolas,monospace;outline:none}textarea:focus{border-color:var(--accent)}.tall{min-height:215px}.token{min-height:115px}.status{margin-top:12px;color:var(--warn);overflow-wrap:anywhere}.msg{display:none;margin-top:12px;padding:10px;border-radius:7px;white-space:pre-wrap}.msg.show{display:block}.ok{color:var(--ok);background:#102c22;border:1px solid #20563f}.error{color:var(--err);background:#35191b;border:1px solid #6b3438}@media(max-width:760px){.grid{grid-template-columns:1fr}.full{grid-column:auto}button{width:100%}}
</style>
</head>
<body><main class="wrap">
<h1 style="text-align: center;">RS-512 JWT CSV Tool</h1><p class="sub">   </p>
<section class="panel"><h2>CSV file</h2><p class="hint">Choose a CSV file first. Existing rows are preserved.</p><div class="buttons"><button id="newCsv" class="primary">Create new CSV file</button><button id="loadCsv">Load existing CSV file</button></div><div id="fileStatus" class="status">No CSV file selected.</div></section>
<section class="panel"> <h2 style="text-align: center; color: red; font-size: 36px;">Encode JWT</h2><div class="grid"><div><label for="raw">Raw data or JSON</label><textarea id="raw" placeholder='Example: {"sub":"1234567890","name":"John Doe"}'></textarea><p class="hint"></p></div><div><label for="privateInput">Private key, PKCS#8 PEM, optional</label><textarea id="privateInput" class="tall" placeholder="-----BEGIN PRIVATE KEY-----"></textarea><p class="hint">Leave empty to generate a Private+Public key pair.</p></div></div>
<div class="buttons"><button id="generateAll" class="primary">Generate Private key + Public key + Encoded JWT &amp; SAVE to file</button><button id="generateExisting">Generate Public key + Encoded JWT &amp; SAVE to file</button><button id="clearEncode" class="danger">Clear all Encode JWT fields</button></div>
<div class="grid"><div class="full"><label>RS512 encoded JWT</label><textarea id="jwtOut" class="token" readonly></textarea></div><div><label>Generated private key</label><textarea id="privateOut" class="tall" readonly></textarea></div><div><label>Generated public key</label><textarea id="publicOut" class="tall" readonly></textarea></div></div><div id="encodeMsg" class="msg"></div></section>
<section class="panel"><h2 style="text-align: center; color: red; font-size: 36px;">Decode JWT</h2><div class="grid"><div class="full"><label>JWT to decode</label><textarea id="jwtIn" class="token"></textarea></div><div class="full"><label>Public key for signature verification, optional</label><textarea id="verifyKey" placeholder="-----BEGIN PUBLIC KEY-----"></textarea></div></div><div class="buttons"><button id="decode" class="primary">Decode JWT</button><button id="clearDecode" class="danger">Clear all Decode JWT fields</button></div><div class="grid"><div><label>Decoded header</label><textarea id="headerOut" readonly></textarea></div><div><label>Decoded payload</label><textarea id="payloadOut" readonly></textarea></div></div><div id="decodeMsg" class="msg"></div></section>
</main><script>
'use strict';const $=id=>document.getElementById(id),te=new TextEncoder(),td=new TextDecoder(),HEAD=['timestamp_utc','raw_data','encoded_jwt','private_key','public_key'];let handle=null,fName='',fText='';
function msg(el,text,type){el.textContent=text;el.className='msg show '+type}function clearMsg(el){el.textContent='';el.className='msg'}
function b64(bytes){let s='',n=32768;for(let i=0;i<bytes.length;i+=n)s+=String.fromCharCode(...bytes.subarray(i,i+n));return btoa(s)}function unb64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}function b64u(bytes){return b64(bytes).replace(/=/g,'').replace(/\+/g,'-').replace(/\//g,'_')}function encText(s){return b64u(te.encode(s))}function dec64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');s+='='.repeat((4-s.length%4)%4);return unb64(s)}
function pemBuf(p){let s=p.replace(/-----BEGIN [^-]+-----/g,'').replace(/-----END [^-]+-----/g,'').replace(/\s/g,'');if(!s)throw Error('The PEM key is empty or invalid.');return unb64(s).buffer}function toPem(buf,label){let s=b64(new Uint8Array(buf)),lines=s.match(/.{1,64}/g).join('\n');return `-----BEGIN ${label}-----\n${lines}\n-----END ${label}-----`}function esc(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function payload(raw){try{let p=JSON.parse(raw);return p&&typeof p==='object'&&!Array.isArray(p)?p:{data:p}}catch{return{data:raw}}}
async function keyPair(){return crypto.subtle.generateKey({name:'RSASSA-PKCS1-v1_5',modulusLength:4096,publicExponent:new Uint8Array([1,0,1]),hash:'SHA-512'},true,['sign','verify'])}async function importPrivate(p){return crypto.subtle.importKey('pkcs8',pemBuf(p),{name:'RSASSA-PKCS1-v1_5',hash:'SHA-512'},true,['sign'])}async function publicFromPrivate(k){let j=await crypto.subtle.exportKey('jwk',k);return crypto.subtle.importKey('jwk',{kty:j.kty,n:j.n,e:j.e,alg:'RS512',ext:true,key_ops:['verify']},{name:'RSASSA-PKCS1-v1_5',hash:'SHA-512'},true,['verify'])}async function importPublic(p){return crypto.subtle.importKey('spki',pemBuf(p),{name:'RSASSA-PKCS1-v1_5',hash:'SHA-512'},false,['verify'])}async function privatePem(k){return toPem(await crypto.subtle.exportKey('pkcs8',k),'PRIVATE KEY')}async function publicPem(k){return toPem(await crypto.subtle.exportKey('spki',k),'PUBLIC KEY')}
async function sign(p,k){let h=encText(JSON.stringify({alg:'RS512',typ:'JWT'})),d=encText(JSON.stringify(p)),input=h+'.'+d,s=await crypto.subtle.sign('RSASSA-PKCS1-v1_5',k,te.encode(input));return input+'.'+b64u(new Uint8Array(s))}
async function writeRow(row){let line=row.map(esc).join(',')+'\n';if(handle){let file=await handle.getFile(),old=await file.text();if(old&&!old.endsWith('\n'))old+='\n';let w=await handle.createWritable();await w.write(old+line);await w.close();return}if(!fName)throw Error('Choose Create new CSV file or Load existing CSV file first.');fText+=line;let url=URL.createObjectURL(new Blob([fText],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=fName;a.click();URL.revokeObjectURL(url)}
async function newCsv(){if('showSaveFilePicker'in window){handle=await showSaveFilePicker({suggestedName:'rs512_jwt_data.csv',types:[{description:'CSV file',accept:{'text/csv':['.csv']}}]});let w=await handle.createWritable();await w.write(HEAD.map(esc).join(',')+'\n');await w.close();fName='';fText='';$('fileStatus').textContent='Selected new file: '+handle.name}else{handle=null;fName='rs512_jwt_data.csv';fText=HEAD.map(esc).join(',')+'\n';$('fileStatus').textContent='Fallback mode: an updated CSV will download after each token.'}}
async function loadCsv(){if('showOpenFilePicker'in window){[handle]=await showOpenFilePicker({multiple:false,types:[{description:'CSV file',accept:{'text/csv':['.csv']}}]});fName='';fText='';$('fileStatus').textContent='Loaded: '+handle.name+'. New rows will be appended.'}else{let i=document.createElement('input');i.type='file';i.accept='.csv,text/csv';i.onchange=async()=>{let f=i.files[0];if(!f)return;handle=null;fName=f.name;fText=await f.text();if(fText&&!fText.endsWith('\n'))fText+='\n';$('fileStatus').textContent='Loaded '+f.name+' in fallback mode.'};i.click()}}
async function generate(mode){clearMsg($('encodeMsg'));let raw=$('raw').value.trim(),given=$('privateInput').value.trim();if(!raw)throw Error('Enter raw data or JSON.');if(!handle&&!fName)throw Error('Choose a CSV file first.');if(mode==='new'&&given)throw Error('Leave the Private key field empty for this button.');if(mode==='existing'&&!given)throw Error('Enter a PKCS#8 private key for this button.');let priv,pub,privPem;if(mode==='new'){let pair=await keyPair();priv=pair.privateKey;pub=pair.publicKey;privPem=await privatePem(priv)}else{priv=await importPrivate(given);pub=await publicFromPrivate(priv);privPem=given}let pubPem=await publicPem(pub),jwt=await sign(payload(raw),priv);$('jwtOut').value=jwt;$('privateOut').value=mode==='new'?privPem:'';$('publicOut').value=pubPem;$('jwtIn').value=jwt;$('verifyKey').value=pubPem;await writeRow([new Date().toISOString(),raw,jwt,privPem,pubPem]);msg($('encodeMsg'),'Success: JWT generated and appended to the selected CSV file.','ok')}
async function decodeJwt(){clearMsg($('decodeMsg'));let token=$('jwtIn').value.trim(),p=token.split('.');if(p.length!==3)throw Error('A JWT must contain exactly three parts.');let h,d;try{h=JSON.parse(td.decode(dec64u(p[0])));d=JSON.parse(td.decode(dec64u(p[1])))}catch{throw Error('The JWT header or payload is invalid.')} $('headerOut').value=JSON.stringify(h,null,2);$('payloadOut').value=JSON.stringify(d,null,2);let pem=$('verifyKey').value.trim();if(!pem){msg($('decodeMsg'),'Decoded. Signature was not verified because no public key was provided.','ok');return}if(h.alg!=='RS512')throw Error('Expected RS512 algorithm.');let key=await importPublic(pem),valid=await crypto.subtle.verify('RSASSA-PKCS1-v1_5',key,dec64u(p[2]),te.encode(p[0]+'.'+p[1]));msg($('decodeMsg'),valid?'Decoded successfully. Signature is valid.':'Decoded, but signature is NOT valid.',valid?'ok':'error')}
$('newCsv').onclick=()=>newCsv().catch(e=>{if(e.name!=='AbortError')msg($('encodeMsg'),e.message,'error')});$('loadCsv').onclick=()=>loadCsv().catch(e=>{if(e.name!=='AbortError')msg($('encodeMsg'),e.message,'error')});$('generateAll').onclick=()=>generate('new').catch(e=>msg($('encodeMsg'),e.message,'error'));$('generateExisting').onclick=()=>generate('existing').catch(e=>msg($('encodeMsg'),e.message,'error'));$('decode').onclick=()=>decodeJwt().catch(e=>msg($('decodeMsg'),e.message,'error'));$('clearEncode').onclick=()=>{['raw','privateInput','jwtOut','privateOut','publicOut'].forEach(x=>$(x).value='');clearMsg($('encodeMsg'))};$('clearDecode').onclick=()=>{['jwtIn','verifyKey','headerOut','payloadOut'].forEach(x=>$(x).value='');clearMsg($('decodeMsg'))};
</script></body></html>
